<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#14533c"/>
      <stop offset="100%" stop-color="#07261b"/>
    </radialGradient>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#e8dec7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d674"/>
      <stop offset="100%" stop-color="#b98926"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.65"/>
  <!-- Back angled shadow domino -->
  <g transform="translate(278 264) rotate(14) translate(-110 -180)">
    <rect x="0" y="0" width="220" height="360" rx="28" fill="#04150f" opacity="0.48"/>
  </g>
  <!-- Main crisp ivory Double-Six/Five domino tilted slightly -->
  <g transform="translate(256 256) rotate(-10) translate(-106 -184)">
    <rect x="8" y="14" width="212" height="368" rx="30" fill="#03120d" opacity="0.5"/>
    <rect x="0" y="0" width="212" height="368" rx="30" fill="url(#tile)" stroke="#d6c59d" stroke-width="6"/>
    <rect x="18" y="180" width="176" height="8" rx="4" fill="url(#gold)"/>
    <circle cx="106" cy="184" r="9" fill="url(#gold)"/>
    <!-- Top half: 6 pips -->
    <circle cx="56" cy="50" r="17" fill="#18222c"/>
    <circle cx="156" cy="50" r="17" fill="#18222c"/>
    <circle cx="56" cy="96" r="17" fill="#18222c"/>
    <circle cx="156" cy="96" r="17" fill="#18222c"/>
    <circle cx="56" cy="142" r="17" fill="#18222c"/>
    <circle cx="156" cy="142" r="17" fill="#18222c"/>
    <!-- Bottom half: 5 pips (gold accent center) -->
    <circle cx="56" cy="226" r="17" fill="#18222c"/>
    <circle cx="156" cy="226" r="17" fill="#18222c"/>
    <circle cx="106" cy="272" r="18" fill="#c0392b"/>
    <circle cx="56" cy="318" r="17" fill="#18222c"/>
    <circle cx="156" cy="318" r="17" fill="#18222c"/>
  </g>
</svg>
